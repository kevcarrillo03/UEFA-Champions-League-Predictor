version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ucl_postgres
    restart: always
    environment:
      POSTGRES_USER: ucl_user
      POSTGRES_PASSWORD: ucl_password
      POSTGRES_DB: ucl_predictor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucl_user -d ucl_predictor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucl_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ucl_user:ucl_password@db:5432/ucl_predictor
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ucl_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: